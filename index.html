<script src="js/logic.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.TTS_CONFIG, I18N = window.TTS_I18N, L = window.TTS;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* ============================== STATE ============================= */
  var state = {
    lang: 'en',
    step: 1,
    config: null,
    availability: [],
    testimonials: [],
    loading: false,
    loadError: false,
    data: {
      name: '', phone: '', consent: false,
      occasion: '', eventDate: '',
      filmLength: '1m', follower: false,
      deliveryDate: '', slotTime: ''
    },
    booking: null
  };
  var LEN_ORDER = L.LENGTHS.slice();   // narrowed to what Config prices
  var TOTAL_STEPS = 4;
  var RESULT_STEP = 5;

  var OCCASIONS = [
    { v: 'Anniversary', k: 'occ_anniversary', icon: 'heart' },
    { v: 'Birthday', k: 'occ_birthday', icon: 'cake' },
    { v: 'Birth memory gift', k: 'occ_birth', icon: 'baby' },
    { v: 'Tribute to loved ones', k: 'occ_tribute', icon: 'candle' },
    { v: 'Other', k: 'occ_other', icon: 'clap' }
  ];
  var ICONS = {
    heart: '<path d="M12 21s-7-4.6-7-9.6A4.4 4.4 0 0112 8.4 4.4 4.4 0 0119 11.4c0 5-7 9.6-7 9.6z"/>',
    cake: '<path d="M4 20h16M5 20v-6h14v6M8 14V9m4 5V9m4 5V9M8 6V4m4 2V4m4 2V4"/>',
    baby: '<circle cx="12" cy="9" r="4"/><path d="M5 21a7 7 0 0114 0"/>',
    candle: '<path d="M10 21h4M12 21v-7M12 14a3 3 0 003-3c0-2-3-5-3-5S9 9 9 11a3 3 0 003 3z"/>',
    clap: '<path d="M3 9l18-4M3 9l2 11h14l2-11H3zM8 5.8l1 3.2M13 4.7l1 3.2"/>'
  };

  /* ============================== I18N ============================== */
  function t(key, vars) {
    var dict = I18N[state.lang] || I18N.en;
    var s = dict[key];
    if (s === undefined) s = I18N.en[key];
    if (s === undefined) return '';
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
      });
    }
    return s;
  }

  function applyI18n() {
    document.documentElement.lang = state.lang;
    $$('[data-i18n]').forEach(function (el) {
      var k = el.getAttribute('data-i18n');
      if (el.id === 'proofBadge' || el.id === 'holdBadge' || el.id === 'how4d') return;
      el.textContent = t(k);
    });
    $$('[data-i18n-ph]').forEach(function (el) {
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
    });
    $$('.langtog button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === state.lang));
    });
    $('#rights').textContent = t('footer_rights', { year: new Date().getFullYear() });
    renderDynamic();
  }

  /* ============================= HELPERS ============================ */
  function cfg() { return state.config || CFG.fallback; }
  function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }

  function fmtDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    try {
      return d.toLocaleDateString(state.lang === 'ta' ? 'ta-IN' : 'en-IN',
        { weekday: 'short', day: 'numeric', month: 'short' });
    } catch (e) { return iso; }
  }

  function lenLabel(code) { return t('len_' + code); }

  /* Short form, used inside the WhatsApp message: "2 min film" reads better
     than "2 minutes film". */
  function lenShort(code) { return t('len_' + code + '_short'); }

  function todayStr() {
    if (state.config && state.config.today) return state.config.today;
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(el._tm);
    el._tm = setTimeout(function () { el.classList.remove('on'); }, 5000);
  }

  function showErr(id, msg) {
    var el = $('#' + id);
    if (!el) return;
    el.textContent = msg || '';
    el.classList.toggle('on', !!msg);
  }

  /* ========================= TRACKING / UTM ========================= */
  var SESSION_KEY = 'tts_session';
  var UTM_KEY = 'tts_utm';

  function sessionId() {
    var s;
    try { s = sessionStorage.getItem(SESSION_KEY); } catch (e) {}
    if (!s) {
      s = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { sessionStorage.setItem(SESSION_KEY, s); } catch (e) {}
    }
    return s;
  }

  function captureUtm() {
    var stored = {};
    try { stored = JSON.parse(sessionStorage.getItem(UTM_KEY) || '{}'); } catch (e) {}
    var q = new URLSearchParams(location.search);
    var map = {
      utm_source: 'utm_source', utm_medium: 'utm_medium', utm_campaign: 'utm_campaign',
      utm_content: 'utm_content', utm_term: 'utm_term',
      ad_id: 'ad_id', adset_id: 'adset_id', campaign_id: 'campaign_id', fbclid: 'fbclid'
    };
    var found = false;
    Object.keys(map).forEach(function (k) {
      var v = q.get(k);
      if (v) { stored[k] = v.slice(0, 200); found = true; }
    });
    if (!stored.referrer && document.referrer) stored.referrer = document.referrer.slice(0, 200);
    if (found || !stored._t) {
      stored._t = Date.now();
      try { sessionStorage.setItem(UTM_KEY, JSON.stringify(stored)); } catch (e) {}
    }
    return stored;
  }
  var UTM = captureUtm();

  /* batched funnel events */
  var queue = [];
  var flushTimer = null;

  function track(event, step) {
    queue.push({
      sessionId: sessionId(),
      event: event,
      step: step === undefined ? '' : String(step),
      language: state.lang,
      utm_campaign: UTM.utm_campaign || ''
    });
    if (queue.length >= 6) flush();
    else {
      clearTimeout(flushTimer);
      flushTimer = setTimeout(flush, 4000);
    }
  }

  function flush(unloading) {
    if (!queue.length || !apiReady()) { queue = []; return; }
    var batch = queue.slice(0, 50);
    queue = [];
    clearTimeout(flushTimer);
    try { API.logEvents(batch, !!unloading); } catch (e) {}
  }
  window.addEventListener('pagehide', function () { flush(true); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flush(true);
  });

  /* Meta Pixel — injected only when a pixel ID is configured */
  function initPixel() {
    if (!CFG.pixelId) return;
    /* eslint-disable */
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    /* eslint-enable */
    window.fbq('init', CFG.pixelId);
    window.fbq('track', 'PageView');
  }

  function pixel(event, params) {
    if (CFG.pixelId && window.fbq) { try { window.fbq('track', event, params || {}); } catch (e) {} }
  }

  /* ================================ API ============================= */
  var API = window.TTS_API || { ready: function () { return false; } };

  function apiReady() { return API.ready(); }

  var CACHE_KEY = 'tts_bootstrap';

  function readCache() {
    try {
      var raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o._t) return null;
      if (Date.now() - o._t > (CFG.cacheSeconds || 60) * 1000) return null;
      return o.payload;
    } catch (e) { return null; }
  }

  function writeCache(payload) {
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ _t: Date.now(), payload: payload })); } catch (e) {}
  }

  function loadBootstrap(force) {
    if (!apiReady()) {
      state.config = Object.assign({}, CFG.fallback, { today: todayStr() });
      state.loadError = true;
      return Promise.resolve();
    }
    if (!force) {
      var cached = readCache();
      if (cached) { adoptBootstrap(cached); return Promise.resolve(); }
    }
    state.loading = true;
    state.loadError = false;
    renderCalendar();
    return API.bootstrap()
      .then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.code) || 'bad_response');
        writeCache(j);
        adoptBootstrap(j);
      })
      .catch(function () {
        state.loading = false;
        state.loadError = true;
        if (!state.config) state.config = Object.assign({}, CFG.fallback, { today: todayStr() });
        renderDynamic();
        renderCalendar();
      });
  }

  /**
   * The Sheet is the source of truth, but an older deployment simply does not
   * know about keys added since. For DISPLAY-ONLY values we fall back to
   * js/config.js when the server did not mention the key at all, so a new
   * one works before the script is redeployed.
   *
   * A key the server DID send wins, including when it sends 0, so clearing a
   * row in the Sheet still hides that value.
   *
   * Only display values belong here. Anything the server validates a booking
   * against — prices, units, lead time — must never be filled in locally, or
   * the page would offer something the server then refuses.
   */
  function fillDisplayGaps(serverConfig) {
    var cfgOut = Object.assign({}, serverConfig);
    var fb = CFG.fallback || {};
    (L.LENGTHS || []).forEach(function (code) {
      var key = 'list_price_' + code;
      if (!(key in cfgOut) && fb[key] !== undefined) cfgOut[key] = fb[key];
    });
    return cfgOut;
  }

  function adoptBootstrap(j) {
    state.config = fillDisplayGaps(j.config);
    state.availability = j.availability || [];
    state.testimonials = j.testimonials || [];
    state.loading = false;
    state.loadError = false;
    renderDynamic();
    renderTestimonials();
    renderCalendar();
  }

  /* ============================== RENDER ============================ */
  function renderDynamic() {
    var c = cfg();
    $('#proofBadge').textContent = t('hero_badge', { count: c.clients_count || '200+' });
    $('#holdBadge').textContent = t('hero_point_3', { hours: c.slot_hold_hours });
    $('#how4d').textContent = t('how_4_d', { delivery: c.delivery_text });
    $('#progLbl').textContent = t('step_of', { n: Math.min(state.step, TOTAL_STEPS), total: TOTAL_STEPS });

    var ig = 'https://instagram.com/' + (c.instagram_handle || 'timetoshoot');
    $('#igLink').href = ig;
    $('#waLink').href = waPlainUrl(t('wa_plain'));

    renderSamples();
    renderOccasions();
    syncLengths();
    renderLenStops();
    renderLength();
    renderFaq();
    renderStep4Copy();
    renderTimes();
    renderMiniSum();
  }

  function renderSamples() {
    var host = $('#reels');
    var items = (CFG.samples || []).filter(function (x) { return x && x.youtube; });

    if (!items.length) {
      /* No films configured yet: show placeholder cards rather than an empty
         strip, so the section still reads as intentional. */
      host.innerHTML = (CFG.samples || []).map(function () {
        return '<div class="reel"><div class="ph">' +
          '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFC700" stroke-width="1.6">' +
          '<path d="M3 9l18-4M3 9l2 11h14l2-11H3z"/></svg>' +
          '<span>' + esc(t('samples_placeholder')) + '</span></div></div>';
      }).join('');
      return;
    }

    if (host._built) { updateSampleCaptions(items); return; }
    host._built = true;

    /* Two copies, so the loop can hand off without a visible jump. */
    host.innerHTML = items.concat(items).map(function (x, i) {
      var id = String(x.youtube).trim();
      var clone = i >= items.length;
      return '<div class="reel" data-i="' + i + '"' + (clone ? ' aria-hidden="true"' : '') + '>' +
        '<button type="button" class="yt" data-yt="' + esc(id) + '" ' +
          (clone ? 'tabindex="-1" ' : '') +
          'aria-label="' + esc(t('samples_play')) + '">' +
          '<img loading="lazy" decoding="async" alt="" ' +
            'src="https://i.ytimg.com/vi/' + esc(id) + '/maxresdefault.jpg" ' +
            'data-fallback="https://i.ytimg.com/vi/' + esc(id) + '/hqdefault.jpg">' +
          '<span class="play">' +
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="#0A0A0A" aria-hidden="true">' +
            '<path d="M8 5v14l11-7z"/></svg>' +
          '</span>' +
        '</button>' +
        (x.label ? '<div class="cap">' + esc(x.label) + '</div>' : '') +
        '</div>';
    }).join('');

    /* Keep the pace even however many films there are. */
    host.style.animationDuration = Math.max(28, items.length * 11) + 's';

    /* maxresdefault does not exist for every upload; fall back quietly. */
    $$('#reels img[data-fallback]').forEach(function (img) {
      img.addEventListener('error', function () {
        var fb = img.getAttribute('data-fallback');
        if (fb && img.src !== fb) { img.removeAttribute('data-fallback'); img.src = fb; }
      });
    });
  }

  /* Language can change after the cards are built. */
  function updateSampleCaptions(items) {
    $$('#reels .reel').forEach(function (box, i) {
      var cap = box.querySelector('.cap');
      var label = items[i] && items[i].label;
      if (label && cap) cap.textContent = label;
      var btn = box.querySelector('.yt');
      if (btn) btn.setAttribute('aria-label', t('samples_play'));
    });
  }

  /** Swap the thumbnail for the real player, once, on tap. */
  function playSample(btn) {
    var id = btn.getAttribute('data-yt');
    if (!id) return;
    var box = btn.parentNode;
    var frame = document.createElement('iframe');
    frame.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) +
                '?autoplay=1&rel=0&playsinline=1&modestbranding=1';
    frame.title = 'Timetoshoot sample film';
    frame.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share';
    frame.setAttribute('allowfullscreen', '');
    frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    box.innerHTML = '';
    box.appendChild(frame);
    /* Nobody wants to watch a film that is sliding off the screen. */
    $('#reels').classList.add('paused');
    track('sample_play', 0);
  }

  function renderOccasions() {
    $('#occGrid').innerHTML = OCCASIONS.map(function (o) {
      return '<button type="button" data-occ="' + o.v + '" aria-pressed="' +
        (state.data.occasion === o.v) + '">' +
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
        ICONS[o.icon] + '</svg><span>' + t(o.k) + '</span></button>';
    }).join('');
    renderEventField();
  }

  function renderEventField() {
    var tribute = state.data.occasion === 'Tribute to loved ones';
    $('#tributeNote').hidden = !tribute;
    $('#eventLabel').textContent = tribute ? t('label_event_date_tribute') : t('label_event_date');
    $('#eventHint').textContent = tribute ? t('event_date_hint_tribute') : t('event_date_hint');
    var inp = $('#f_event');
    inp.min = todayStr();
    inp.max = L.addDays(todayStr(), 400);
  }

  /* Only offer the lengths this Sheet prices, and keep the chosen one valid. */
  function syncLengths() {
    var list = L.availableLengths(cfg());
    LEN_ORDER = list.length ? list : L.LENGTHS.slice();
    if (LEN_ORDER.indexOf(state.data.filmLength) === -1) {
      state.data.filmLength = LEN_ORDER[Math.min(1, LEN_ORDER.length - 1)];
    }
    var slider = $('#f_len');
    slider.max = String(LEN_ORDER.length - 1);
  }

  function renderLenStops() {
    $('#lenStops').innerHTML = LEN_ORDER.map(function (code, i) {
      /* Short labels on the scale: six full ones ("30 seconds" ... "5
         minutes") do not fit across a 360px phone and the last is clipped.
         The full name still shows in the price box below. */
      return '<button type="button" data-len="' + code + '" aria-pressed="' +
        (state.data.filmLength === code) + '" aria-label="' + esc(lenLabel(code)) + '">' +
        lenShort(code) + '</button>';
    }).join('');
  }

  function renderLength() {
    var c = cfg();
    var code = state.data.filmLength;
    var idx = LEN_ORDER.indexOf(code);
    $('#f_len').value = String(idx);
    var span = Math.max(1, LEN_ORDER.length - 1);
    $('#trackFill').style.width = 'calc(' + (idx / span * 100) + '% - ' + (idx / span * 12) + 'px)';
    $$('#lenStops button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-len') === code));
    });

    var p = L.calcPrice(c, code, state.data.follower);
    $('#lenLabel').textContent = t('your_film', { length: lenLabel(code) });
    $('#lenPrice').textContent = money(p.total);
    var was = $('#lenWas');
    was.hidden = !(p.list > p.total);
    was.textContent = p.list > p.total ? money(p.list) : '';
    $('#lenOff').textContent = p.discount ? t('discount_applied', { amount: p.discount }) : '';
    $('#followLabel').textContent = t('follower_check', { handle: c.instagram_handle || 'timetoshoot' });
    $('#followWrap').classList.toggle('on', state.data.follower);
    $('#f_follower').checked = state.data.follower;
  }

  /* ------------------------- time slots ------------------------- */

  /** The times offered on the chosen date, with the taken ones struck out. */
  function renderTimes() {
    var wrap = $('#timeWrap');
    var grid = $('#timeGrid');
    if (!wrap) return;

    var d = state.data;
    if (!d.deliveryDate) { wrap.hidden = true; grid.innerHTML = ''; return; }

    var day = null;
    for (var i = 0; i < state.availability.length; i++) {
      if (state.availability[i].date === d.deliveryDate) { day = state.availability[i]; break; }
    }
    var times = (day && day.times) ? day.times
      : (cfg().time_slots || []).map(function (x) { return { time: x, taken: false }; });

    if (!times.length) { wrap.hidden = true; grid.innerHTML = ''; return; }

    wrap.hidden = false;
    $('#timeTitle').textContent = t('time_title', { date: fmtDate(d.deliveryDate) });
    grid.innerHTML = times.map(function (x) {
      var on = (x.time === d.slotTime);
      return '<button type="button" class="tchip" data-time="' + esc(x.time) + '"' +
        (x.taken ? ' disabled' : '') + ' aria-pressed="' + on + '">' +
        '<span>' + esc(x.time) + '</span>' +
        (x.taken ? '<span class="s">' + t('time_taken') + '</span>' : '') +
        '</button>';
    }).join('');
  }

  /* --------------------- the one-line summary -------------------- */

  function renderMiniSum() {
    var box = $('#miniSum');
    if (!box) return;
    var d = state.data;
    var c = cfg();

    $('#reserveNote').textContent = t('reserve_note', { hours: c.slot_hold_hours });

    if (!d.deliveryDate || !d.slotTime) { box.hidden = true; updateReserveBtn(); return; }

    var p = L.calcPrice(c, d.filmLength, d.follower);
    box.hidden = false;
    $('#miniSumText').textContent = t('mini_sum', {
      length: lenLabel(d.filmLength),
      date: fmtDate(d.deliveryDate),
      time: d.slotTime
    });
    $('#miniSumPrice').textContent = money(p.total);
    var mwas = $('#miniSumWas');
    mwas.hidden = !(p.list > p.total);
    mwas.textContent = p.list > p.total ? money(p.list) : '';
    updateReserveBtn();
  }

  function updateReserveBtn() {
    var btn = $('#reserveBtn');
    if (!btn || btn.dataset.busy === '1') return;
    btn.disabled = !(state.data.deliveryDate && state.data.slotTime);
  }

  function renderStep4Copy() {
    var ev = state.data.eventDate;
    $('#s4sub').textContent = ev ? t('s4_sub_event', { date: fmtDate(ev) }) : t('s4_sub');
    $('#twoMinNote').hidden = state.data.filmLength !== '2m';
  }

  var DOW = { en: ['S', 'M', 'T', 'W', 'T', 'F', 'S'], ta: ['ஞா', 'தி', 'செ', 'பு', 'வி', 'வெ', 'ச'] };

  function renderCalendar() {
    var host = $('#calWrap');
    var c = cfg();

    if (state.loading) {
      host.innerHTML = '<p class="muted" style="font-size:14px;margin:0 0 10px">' + t('loading_dates') + '</p>' +
        '<div class="skel">' + new Array(28).join('<i></i>') + '</div>';
      renderTimes();
      renderMiniSum();
      return;
    }

    if (state.loadError && !state.availability.length) {
      host.innerHTML = '<div class="nofit"><b>' + t('load_failed') + '</b>' +
        '<p>' + t('err_offline') + '</p>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="retryBtn">' + t('retry') + '</button></div>';
      var rb = $('#retryBtn');
      if (rb) rb.addEventListener('click', function () { loadBootstrap(true); });
      renderTimes();
      renderMiniSum();
      return;
    }

    var units = L.unitsFor(c, state.data.filmLength);
    var cal = L.buildCalendar(state.availability, {
      today: todayStr(),
      minLeadDays: c.min_lead_days,
      bookingWindowDays: c.booking_window_days,
      eventDate: state.data.eventDate,
      units: units
    });

    /* clear a selection that is no longer valid (e.g. length changed to 2m) */
    if (state.data.deliveryDate) {
      var still = cal.filter(function (d) { return d.date === state.data.deliveryDate && d.selectable; });
      if (!still.length) { state.data.deliveryDate = ''; state.data.slotTime = ''; }
      else if (state.data.slotTime && still[0].times) {
        /* the time we had chosen may have gone while they were deciding */
        var ok = still[0].times.filter(function (x) {
          return x.time === state.data.slotTime && !x.taken;
        }).length;
        if (!ok) state.data.slotTime = '';
      }
    }

    if (!L.hasAnySelectable(cal)) {
      host.innerHTML = '<div class="nofit"><b>' + t('no_dates_title') + '</b>' +
        '<p>' + t('no_dates_body', { date: fmtDate(state.data.eventDate || L.addDays(todayStr(), c.min_lead_days)) }) + '</p>' +
        '<a class="btn btn-wa" id="rushBtn" href="#" style="width:100%">' + t('rush_cta') + '</a></div>';
      var rush = $('#rushBtn');
      rush.href = waUrl(t('wa_rush', {
        name: state.data.name || '-',
        length: lenShort(state.data.filmLength),
        date: fmtDate(state.data.eventDate || L.addDays(todayStr(), c.min_lead_days))
      }));
      rush.addEventListener('click', function () { track('rush_click', 4); flush(true); });
      track('no_dates_fit', 4);
      renderTimes();
      renderMiniSum();
      return;
    }

    /* group by month */
    var months = [];
    var byMonth = {};
    cal.forEach(function (d) {
      var key = d.date.slice(0, 7);
      if (!byMonth[key]) { byMonth[key] = []; months.push(key); }
      byMonth[key].push(d);
    });

    var dow = DOW[state.lang] || DOW.en;
    host.innerHTML = months.map(function (key) {
      var days = byMonth[key];
      var p = key.split('-');
      var title;
      try {
        title = new Date(+p[0], +p[1] - 1, 1).toLocaleDateString(
          state.lang === 'ta' ? 'ta-IN' : 'en-IN', { month: 'long', year: 'numeric' });
      } catch (e) { title = key; }

      var firstDow = new Date(+p[0], +p[1] - 1, +days[0].date.slice(8, 10)).getDay();
      var pads = new Array(firstDow).fill('<span class="day pad"></span>').join('');

      var cells = days.map(function (d) {
        var cls = ['day'];
        var dis = '';
        var label = d.date.slice(8, 10).replace(/^0/, '');
        var sub = '';
        if (d.date === state.data.deliveryDate) { cls.push('sel'); sub = t('legend_selected'); }
        else if (d.selectable) {
          cls.push('avail');
          if (d.best) cls.push('best');
          sub = t('slots_left', { n: d.slotsLeft });
        } else if (d.reason === 'full') { cls.push('full'); sub = t('full'); dis = 'disabled'; }
        else { cls.push('dis'); dis = 'disabled'; }
        return '<button type="button" class="' + cls.join(' ') + '" ' + dis +
          ' data-date="' + d.date + '" aria-label="' + fmtDate(d.date) + ' ' + sub + '">' +
          '<span>' + label + '</span><span class="s">' + sub + '</span></button>';
      }).join('');

      return '<div class="month"><h4>' + title + '</h4>' +
        '<div class="dow">' + dow.map(function (x) { return '<span>' + x + '</span>'; }).join('') + '</div>' +
        '<div class="days">' + pads + cells + '</div></div>';
    }).join('');

    renderTimes();
    renderMiniSum();
  }

  function occName(v) {
    var found = OCCASIONS.filter(function (o) { return o.v === v; })[0];
    return found ? t(found.k) : '—';
  }

  /* Screenshots of real feedback. Nothing is invented here: the section only
     appears when the owner has actually added files. */
  function renderShots() {
    var host = $('#shots');
    var shots = (CFG.reviewImages || []).filter(function (x) { return x && String(x).trim(); });
    if (!shots.length) { $('#shotsMarquee').hidden = true; host.innerHTML = ''; return false; }

    if (!host._built) {
      host._built = true;
      host.innerHTML = shots.concat(shots).map(function (src, i) {
        var clone = i >= shots.length;
        return '<button type="button" class="shot" data-src="' + esc(src) + '" ' +
          (clone ? 'tabindex="-1" aria-hidden="true" ' : '') +
          'aria-label="' + esc(t('testi_open')) + '">' +
          '<img loading="lazy" decoding="async" alt="" src="' + esc(src) + '">' +
          '</button>';
      }).join('');
      host.style.animationDuration = Math.max(30, shots.length * 9) + 's';
      /* A file that never arrived should not leave a grey hole in the grid. */
      $$('#shots img').forEach(function (img) {
        img.addEventListener('error', function () {
          var b = img.closest('.shot');
          if (b) b.remove();
          if (!$('#shots .shot')) { $('#shotsMarquee').hidden = true; }
        });
      });
    }
    $('#shotsMarquee').hidden = false;
    return true;
  }

  function renderTestimonials() {
    var sec = $('#testimonials');
    var hasShots = renderShots();
    if (!state.testimonials.length && !hasShots) { sec.hidden = true; return; }
    sec.hidden = false;
    $('#testiSub').hidden = !hasShots;
    if (!state.testimonials.length) { $('#tcards').innerHTML = ''; return; }
    $('#tcards').innerHTML = state.testimonials.map(function (x) {
      var who = [x.name, x.occasion].filter(Boolean);
      return '<figure class="tcard" style="margin:0">' +
        '<p>“' + esc(x.text) + '”</p>' +
        (who.length ? '<figcaption class="who"><b>' + esc(who[0]) + '</b>' +
          (who[1] ? ' · ' + esc(who[1]) : '') + '</figcaption>' : '') +
        '</figure>';
    }).join('');
  }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderFaq() {
    var c = cfg();
    var rev = (c.revisions_text && String(c.revisions_text).trim()) || t('faq_3_a_default');
    var items = [
      ['faq_1_q', t('faq_1_a')],
      ['faq_2_q', t('faq_2_a', { delivery: c.delivery_text })],
      ['faq_3_q', rev],
      ['faq_4_q', t('faq_4_a')],
      ['faq_5_q', t('faq_5_a')],
      ['faq_6_q', t('faq_6_a')]
    ];
    $('#faqList').innerHTML = items.map(function (it) {
      return '<details><summary>' + t(it[0]) + '</summary><p>' + esc(it[1]) + '</p></details>';
    }).join('');
  }

  /* ============================ NAVIGATION ========================== */
  function goStep(n, skipTrack) {
    state.step = n;
    $$('.step').forEach(function (s) {
      s.classList.toggle('on', Number(s.getAttribute('data-step')) === n);
    });
    var pct = n > TOTAL_STEPS ? 100 : Math.round((n / TOTAL_STEPS) * 100);
    $('#progBar').style.width = pct + '%';
    $('#progLbl').textContent = n > TOTAL_STEPS ? '' : t('step_of', { n: n, total: TOTAL_STEPS });
    $('#sticky').classList.add('hide');

    if (n === 4) { renderStep4Copy(); renderCalendar(); }
    if (!skipTrack) track('step_' + n, n);

    var card = $('.formcard');
    var top = card.getBoundingClientRect().top + window.pageYOffset - 70;
    window.scrollTo({ top: top, behavior: 'smooth' });
  }

  function validate(step) {
    var d = state.data;
    var c = cfg();
    if (step === 1) {
      d.name = $('#f_name').value.trim();
      d.phone = $('#f_phone').value;
      d.consent = $('#f_consent').checked;
      if (!L.isValidName(d.name)) { showErr('e1', t('err_name')); $('#f_name').focus(); return false; }
      if (!L.isValidPhone(d.phone)) { showErr('e1', t('err_phone')); $('#f_phone').focus(); return false; }
      if (!d.consent) { showErr('e1', t('err_consent')); return false; }
      d.phone = L.normalizePhone(d.phone);
      showErr('e1', '');
      return true;
    }
    if (step === 2) {
      d.eventDate = L.normDate($('#f_event').value);
      if (!d.occasion) { showErr('e2', t('err_occasion')); return false; }
      var tribute = d.occasion === 'Tribute to loved ones';
      if (!tribute && !d.eventDate) { showErr('e2', t('err_event_date')); $('#f_event').focus(); return false; }
      if (d.eventDate && d.eventDate < todayStr()) { showErr('e2', t('err_event_past')); return false; }
      showErr('e2', '');
      return true;
    }
    if (step === 3) { showErr('e3', ''); return true; }
    if (step === 4) {
      if (!d.deliveryDate) { showErr('e4', t('err_pick_date')); return false; }
      if (!d.slotTime) { showErr('e4', t('err_pick_time')); return false; }
      showErr('e4', '');
      return true;
    }
    return true;
  }

  /* ============================= WHATSAPP =========================== */

  /* Booking messages go through the number, because only that form of the
     link can carry a prefilled message (reference, date, time, total).
     NOTE: wa.me mangles emoji into a replacement character, so the strings in
     js/i18n.js deliberately contain none. Tamil and the rupee sign survive. */
  function waUrl(text) {
    var num = String(cfg().whatsapp_number || '917448326503').replace(/[^0-9]/g, '');
    return 'https://wa.me/' + num + '?text=' + encodeURIComponent(text);
  }

  /* The plain "message us" buttons use the Business short link when Config
     has one, since there is nothing to prefill there. */
  function waPlainUrl(fallbackText) {
    var link = String(cfg().whatsapp_link || '').trim();
    if (/^https:\/\/(wa\.me|api\.whatsapp\.com)\//.test(link)) return link;
    return waUrl(fallbackText);
  }

  /* ============================== SUBMIT ============================ */
  /**
   * Records the reservation, then shows the Continue on WhatsApp button.
   * A reservation is an interest record, never a confirmed booking: the real
   * date is agreed with the customer in the chat.
   */
  function submitBooking() {
    var c = cfg();
    var d = state.data;
    var btn = $('#reserveBtn');
    if (btn.disabled || btn.dataset.busy === '1') return;

    if (!validate(1) || !validate(2)) { goStep(1); return; }
    if (!validate(4)) return;

    if (!apiReady()) {
      showErr('e4', t('err_generic'));
      toast(t('err_generic'));
      return;
    }

    btn.dataset.busy = '1';
    btn.disabled = true;
    btn.textContent = t('submitting');
    showErr('e4', '');

    var payload = {
      name: d.name,
      phone: d.phone,
      consent: true,
      occasion: d.occasion,
      eventDate: d.eventDate,
      filmLength: d.filmLength,
      deliveryDate: d.deliveryDate,
      slotTime: d.slotTime,
      follower: d.follower,
      honeypot: $('#hp').value,
      language: state.lang,
      utm_source: UTM.utm_source || '',
      utm_medium: UTM.utm_medium || '',
      utm_campaign: UTM.utm_campaign || '',
      utm_content: UTM.utm_content || '',
      ad_id: UTM.ad_id || UTM.adset_id || '',
      fbclid: UTM.fbclid || '',
      referrer: UTM.referrer || ''
    };

    API.createBooking(payload)
      .then(function (j) {
        btn.dataset.busy = '';
        btn.textContent = t('reserve_cta');
        updateReserveBtn();

        if (!j || !j.ok) {
          var code = (j && j.code) || '';
          if (code === 'SLOT_TAKEN' || code === 'BAD_TIME') {
            track('slot_taken', 4);
            showErr('e4', '');
            toast(t('err_slot_taken'));
            try { sessionStorage.removeItem(CACHE_KEY); } catch (e) {}
            state.data.slotTime = '';
            loadBootstrap(true).then(function () { goStep(4, true); });
            return;
          }
          if (code === 'RATE_LIMIT') { showErr('e4', t('err_rate_limit')); return; }
          if (code === 'DUPLICATE') { showErr('e4', t('err_duplicate')); return; }
          if (code === 'BAD_PHONE') { showErr('e4', t('err_phone')); return; }
          if (code === 'NO_CONSENT') { showErr('e4', t('err_consent')); return; }
          if (code === 'LEAD_TIME' || code === 'AFTER_EVENT' || code === 'OUT_OF_WINDOW' || code === 'BAD_DATE') {
            showErr('e4', (j && j.message) || t('err_generic'));
            loadBootstrap(true).then(function () { goStep(4, true); });
            return;
          }
          showErr('e4', (j && j.message) || t('err_generic'));
          return;
        }

        /* success */
        state.booking = j;
        try { sessionStorage.removeItem(CACHE_KEY); } catch (e) {}

        var shownDate = fmtDate(j.deliveryDate || d.deliveryDate);
        var shownTime = j.slotTime || d.slotTime;

        var url = waUrl(t('wa_message', {
          name: d.name,
          id: j.bookingId,
          occasion: occName(d.occasion),
          length: lenShort(d.filmLength),
          date: shownDate,
          time: shownTime,
          amount: Number(j.total).toLocaleString('en-IN')
        }));

        $('#successBody').textContent = t('success_body', { id: j.bookingId });
        $('#successSlotText').textContent = t('mini_sum', {
          length: lenLabel(d.filmLength), date: shownDate, time: shownTime
        });
        $('#successNote').textContent = t('success_note', { hours: j.holdHours || c.slot_hold_hours });
        $('#waBtn').href = url;
        goStep(RESULT_STEP, true);

        pixel('Lead', {
          value: Number(j.total) || 0,
          currency: 'INR',
          content_name: 'Memory film ' + d.filmLength,
          content_category: d.occasion
        });
        track('booking_created', 4);
        track('whatsapp_redirect', 4);
        flush(true);

        setTimeout(function () { window.location.href = url; }, 450);
      })
      .catch(function () {
        btn.dataset.busy = '';
        btn.textContent = t('reserve_cta');
        updateReserveBtn();
        showErr('e4', navigator.onLine === false ? t('err_offline') : t('err_generic'));
      });
  }

  /* ============================== EVENTS ============================ */
  function bind() {
    /* language */
    $$('.langtog button').forEach(function (b) {
      b.addEventListener('click', function () {
        state.lang = b.getAttribute('data-lang');
        try { localStorage.setItem('tts_lang', state.lang); } catch (e) {}
        applyI18n();
        renderCalendar();
        goStep(state.step, true);
        track('lang_' + state.lang, state.step);
      });
    });

    /* review screenshots open full size */
    var lb = $('#lightbox');
    $('#shots').addEventListener('click', function (e) {
      var b = e.target.closest('.shot');
      if (!b) return;
      $('#lightboxImg').src = b.getAttribute('data-src');
      $('#shots').classList.add('paused');
      lb.classList.add('on');
      $('#lightboxClose').focus();
    });
    function closeLightbox() {
      lb.classList.remove('on');
      $('#lightboxImg').src = '';
      $('#shots').classList.remove('paused');
    }
    $('#lightboxClose').addEventListener('click', closeLightbox);
    lb.addEventListener('click', function (e) { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && lb.classList.contains('on')) closeLightbox();
    });

    /* sample films: fetch the player only when someone asks for it */
    $('#reels').addEventListener('click', function (e) {
      var btn = e.target.closest('.yt');
      if (btn) playSample(btn);
    });

    /* primary CTAs */
    $$('[data-goto-book]').forEach(function (b) {
      b.addEventListener('click', function () {
        track('form_start', 1);
        $('#book').scrollIntoView({ behavior: 'smooth', block: 'start' });
        setTimeout(function () { $('#f_name').focus({ preventScroll: true }); }, 500);
      });
    });

    /* next / back */
    $$('[data-next]').forEach(function (b) {
      b.addEventListener('click', function () {
        var s = Number(b.getAttribute('data-next'));
        if (validate(s)) goStep(s + 1);
      });
    });
    $$('[data-back]').forEach(function (b) {
      b.addEventListener('click', function () {
        goStep(Math.max(1, Number(b.getAttribute('data-back')) - 1), true);
      });
    });

    /* step 1 live */
    $('#f_consent').addEventListener('change', function () {
      $('#consentWrap').classList.toggle('on', this.checked);
    });
    $('#f_phone').addEventListener('input', function () {
      this.value = this.value.replace(/[^0-9+\s]/g, '');
    });

    /* step 2 */
    $('#occGrid').addEventListener('click', function (e) {
      var b = e.target.closest('[data-occ]');
      if (!b) return;
      state.data.occasion = b.getAttribute('data-occ');
      $$('#occGrid button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === b));
        x.classList.remove('tapped');
      });
      /* restart the ripple even when the same card is tapped again */
      void b.offsetWidth;
      b.classList.add('tapped');
      renderEventField();
      showErr('e2', '');
    });
    /* A native date input only opens its calendar from the small icon, which
       people do not find. Open it from anywhere in the field. */
    var eventField = $('#f_event');
    function openDatePicker() {
      if (typeof eventField.showPicker !== 'function') return;   // older browsers keep the icon
      try { eventField.showPicker(); } catch (e) { /* needs a user gesture; ignore */ }
    }
    eventField.addEventListener('click', openDatePicker);
    eventField.addEventListener('focus', openDatePicker);
    eventField.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDatePicker(); }
    });

    eventField.addEventListener('change', function () {
      state.data.eventDate = L.normDate(this.value);
      state.data.deliveryDate = '';
      state.data.slotTime = '';
      renderStep4Copy();
    });

    /* step 3 */
    $('#f_len').addEventListener('input', function () {
      state.data.filmLength = LEN_ORDER[Number(this.value)] || '1m';
      state.data.deliveryDate = '';
      state.data.slotTime = '';
      renderLength();
    });
    $('#lenStops').addEventListener('click', function (e) {
      var b = e.target.closest('[data-len]');
      if (!b) return;
      state.data.filmLength = b.getAttribute('data-len');
      state.data.deliveryDate = '';
      state.data.slotTime = '';
      renderLength();
    });
    $('#f_follower').addEventListener('change', function () {
      state.data.follower = this.checked;
      renderLength();
    });

    /* step 4 */
    $('#calWrap').addEventListener('click', function (e) {
      var b = e.target.closest('[data-date]');
      if (!b || b.disabled) return;
      if (state.data.deliveryDate !== b.getAttribute('data-date')) state.data.slotTime = '';
      state.data.deliveryDate = b.getAttribute('data-date');
      showErr('e4', '');
      renderCalendar();
      track('date_selected', 4);
      var tw = $('#timeWrap');
      if (tw && !tw.hidden) {
        window.scrollTo({ top: tw.getBoundingClientRect().top + window.pageYOffset - 90, behavior: 'smooth' });
      }
    });

    $('#timeGrid').addEventListener('click', function (e) {
      var b = e.target.closest('[data-time]');
      if (!b || b.disabled) return;
      state.data.slotTime = b.getAttribute('data-time');
      showErr('e4', '');
      renderTimes();
      renderMiniSum();
      track('time_selected', 4);
    });

    /* direct WhatsApp chat from the calendar step */
    /* submit */
    $('#bookForm').addEventListener('submit', function (e) {
      e.preventDefault();
      submitBooking();
    });

    /* Sticky CTA: show it only in the middle of the page — not while the hero
       button is already on screen, and not once the form itself is visible. */
    var heroCta = $('.hero [data-goto-book]');
    var formSec = $('#book');
    var seen = { hero: true, form: false };
    function syncSticky() {
      $('#sticky').classList.toggle('hide', seen.hero || seen.form || state.step > 1);
    }
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.target === heroCta) seen.hero = en.isIntersecting;
          if (en.target === formSec) seen.form = en.isIntersecting;
        });
        syncSticky();
      }, { threshold: 0.1 });
      io.observe(heroCta);
      io.observe(formSec);
    } else {
      $('#sticky').classList.remove('hide');
    }

    /* refresh availability when the visitor comes back to the tab */
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && state.step >= 4) loadBootstrap(true);
    });
  }

  /* =============================== INIT ============================= */
  function init() {
    try {
      var saved = localStorage.getItem('tts_lang');
      if (saved === 'ta' || saved === 'en') state.lang = saved;
      else if ((navigator.language || '').toLowerCase().indexOf('ta') === 0) state.lang = 'ta';
    } catch (e) {}

    state.config = Object.assign({}, CFG.fallback, { today: todayStr() });
    applyI18n();
    bind();
    initPixel();
    track('page_view', 0);
    loadBootstrap(false);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
